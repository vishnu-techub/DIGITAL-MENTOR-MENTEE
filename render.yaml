services:
  # ------------------------------------------------------------
  # KSRCE Digital Mentor-Mentee Backend API Service
  # ------------------------------------------------------------
  - type: web
    name: digital-mentor-mentee-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Ksrce@admin
      - key: ADMIN_EMAIL
        value: admin@ksrce.ac.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DEPT
        value: IT
      - key: MONGODB_URI
        sync: false

  # ------------------------------------------------------------
  # KSRCE Digital Mentor-Mentee Frontend Static Web Application
  # ------------------------------------------------------------
  - type: static
    name: digital-mentor-mentee-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=optional && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: digital-mentor-mentee-backend
          property: host
