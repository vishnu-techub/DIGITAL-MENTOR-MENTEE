<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/ksrce-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B2545" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KSRCE Mentoring" />
    <link rel="apple-touch-icon" href="/ksrce-logo.png" />
    <title>KSRCE Digital Mentor–Mentee Management System | K.S.R. College of Engineering</title>
    <meta name="description" content="Centralized Institutional Digital Mentor-Mentee Management and Academic Counseling System for K.S.R. College of Engineering (Autonomous), Tiruchengode." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(
            function(registration) {
              console.log('✓ KSRCE PWA Service Worker registered with scope: ', registration.scope);
            },
            function(err) {
              console.log('KSRCE PWA Service Worker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
